<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Status — RJ NETWORK</title><link rel="stylesheet" href="assets/app.css"></head><body><div class="bg"></div><canvas id="netbg"></canvas><header class="header glass strong"><div class="container hi"><a class="brand" href="index.html"><div><div class="bt font-display">RJ NETWORK</div><div class="bs">Ticket Status</div></div></a><nav class="nav"><a href="index.html">হোম</a><a href="support.html">সাপোর্ট</a><a class="active" href="ticket.html">টিকেট</a></nav></div></header><main class="container"><section class="hero"><div class="badge glass"><span class="dot"></span> Ticket Tracking</div><h1>আপনার <span style="color:var(--c)">Ticket Status</span></h1><p>Ticket ID ও মোবাইল নম্বর দিয়ে বর্তমান অবস্থা দেখুন।</p></section><section class="section"><div class="form glass"><form id="lookup"><div><label>Ticket ID *</label><input id="code" required maxlength="32" placeholder="যেমন: RJ-20260923-ABC123"></div><div style="margin-top:15px"><label>মোবাইল নম্বর *</label><input id="phone" required inputmode="tel" maxlength="15" placeholder="01XXXXXXXXX"></div><button class="btn primary" style="width:100%;margin-top:15px">স্ট্যাটাস দেখুন</button></form><div id="result" style="margin-top:18px" hidden></div></div></section></main><script src="assets/config.js"></script><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const qs=new URLSearchParams(location.search);if(qs.get('ticket'))code.value=qs.get('ticket');
lookup.onsubmit=async e=>{e.preventDefault();result.hidden=true;try{const d=await RJ_API.request('/api/ticket/lookup',{method:'POST',body:JSON.stringify({ticketCode:code.value.trim(),phone:phone.value.trim()})});const t=d.ticket;result.hidden=false;result.className='notice';result.innerHTML=`<h3>${t.ticket_code}</h3><p><b>${t.subject}</b></p><div class="grid g2"><div><span class="muted small">Status</span><br><b>${t.status}</b></div><div><span class="muted small">Priority</span><br><b>${t.priority}</b></div><div><span class="muted small">Created</span><br><b>${new Date(t.created_at).toLocaleString('bn-BD')}</b></div></div><hr style="opacity:.15;margin:16px 0"><b>Activity</b><div style="margin-top:10px">${(d.events||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)">${x.new_status||x.event_type} <span class="muted small">${new Date(x.created_at).toLocaleString('bn-BD')}</span>${x.note?`<br><span class="muted small">${x.note}</span>`:''}</div>`).join('')}</div>`}catch(err){result.hidden=false;result.className='alert';result.textContent=err.message==='API_BASE_NOT_CONFIGURED'?'V2.2 API URL এখনো সেট করা হয়নি।':'Ticket ID বা মোবাইল নম্বর মিলছে না।'}};
</script></body></html>
