name = "rj-network-v2-api"
main = "src/index.js"
compatibility_date = "2026-09-23"

[vars]
ALLOWED_ORIGINS = "https://rjnetworkjhaudia.github.io,http://localhost:8788"

[[d1_databases]]
binding = "DB"
database_name = "rj-network"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[secrets]
required = ["ADMIN_API_KEY"]

# Optional secrets can be added when those features are enabled:
# TURNSTILE_SECRET_KEY
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID


[triggers]
crons = ["15 2 * * *"]
